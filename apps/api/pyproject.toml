[project]
name = "dealsense-api"
version = "0.1.0"
description = "DealSense FastAPI Backend — Webhook gateway, OAuth, scoring, retrieval, and CRM intelligence API"
requires-python = ">=3.12"
dependencies = [
    # ---- Web Framework ----
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # ---- Database ----
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",

    # ---- Redis ----
    "redis[hiredis]>=5.2.0",

    # ---- HTTP Client ----
    "httpx>=0.28.0",

    # ---- Security ----
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0",

    # ---- Observability ----
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",

    # ---- AI / LLM ----
    "openai>=1.50.0",
    "tiktoken>=0.8.0",

    # ---- Utilities ----
    "python-multipart>=0.0.12",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
