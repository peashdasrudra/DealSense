# ==============================================================================
# DealSense — Render Blueprint Infrastructure-as-Code
# ==============================================================================
# Declares the production web service configuration for automated builds,
# health checks, and zero-downtime deployments on Render.
# ==============================================================================

services:
  - type: web
    name: dealsense-api
    runtime: python
    buildCommand: pip install -e packages/scoring && pip install -e apps/api
    startCommand: uvicorn dealsense.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/v1/health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: HUBSPOT_REDIRECT_URI
        value: https://dealsense.peash.tech/oauth/callback
      - key: APP_BASE_URL
        value: https://dealsense.peash.tech
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_APP_ID
        sync: false
